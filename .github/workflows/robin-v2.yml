name: Build Robin Launcher V2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Tools
        run: |
          pip install pillow
          curl -L -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          curl -L -o signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          curl -L -o fcl.apk https://github.com/FCL-Team/FoldCraftLauncher/releases/download/1.3.4.4/FCL-release-1.3.4.4-arm64-v8a.apk
      - name: Patch and build
        run: |
          java -jar apktool.jar d -f -o fcl fcl.apk
          python3 -I v2/apply_fcl.py "$PWD/fcl" "$PWD/v2/mojo_default.json" "$PWD/v2/logo.png"
          java -jar apktool.jar b -f -o unsigned.apk fcl
          java -jar signer.jar -a unsigned.apk --ks v2/robin.jks --ksAlias mojo --ksPass mojogames --ksKeyPass mojogames -o out
          mv out/unsigned-aligned-signed.apk RobinLauncherV2.apk
          sha256sum RobinLauncherV2.apk
      - name: Release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release delete robin-launcher-v2 -y --cleanup-tag || true
          gh release create robin-launcher-v2 RobinLauncherV2.apk --title "Robin Launcher V2" --notes "Robin Launcher V2, based on FoldCraftLauncher 1.3.4.4 (GPLv3, credit FCL-Team). Uninstall the original FCL first."
