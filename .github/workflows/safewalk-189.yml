name: SafeWalk 1.8.9 build
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release'
        default: 'true'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "7.6.4" }
      - name: Build
        working-directory: safewalk-189
        run: |
          gradle --no-daemon build
          ls -la build/libs
      - uses: actions/upload-artifact@v4
        with: { name: safewalk-jar, path: safewalk-189/build/libs/safewalk-1.0.0.jar }
      - name: Release
        if: ${{ github.event.inputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete safewalk-1.8.9 --cleanup-tag --yes || true
          gh release create safewalk-1.8.9 safewalk-189/build/libs/safewalk-1.0.0.jar --title "Robin SafeWalk 1.8.9 Forge" --notes "SafeWalk for Minecraft 1.8.9 Forge. V toggles. Auto-sneaks at block edges and places the held block to extend the floor. Many servers ban this."
