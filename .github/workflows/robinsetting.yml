name: Build Robin Setting
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        working-directory: robinsetting
        run: gradle --no-daemon assembleRelease
      - name: Release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          cp robinsetting/app/build/outputs/apk/release/app-release.apk RobinSetting.apk
          gh release delete robinsetting -y --cleanup-tag || true
          gh release create robinsetting RobinSetting.apk --title "Robin Setting" --notes "Settings hub with search, refresh rate 60/90/120/144 Hz and per-app Hz."
