name: AutoCartPvP 1.21.4 build
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release'
        default: 'true'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.12' }
      - name: Build
        working-directory: autocartpvp
        run: |
          ./scripts/resolve-versions.sh 1.21.4 || echo "using pinned versions"
          gradle --no-daemon build
          ls -la build/libs
      - uses: actions/upload-artifact@v4
        with: { name: autocartpvp-jar, path: autocartpvp/build/libs/*.jar }
      - name: Release
        if: ${{ github.event.inputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete autocartpvp-1.21.4 --cleanup-tag --yes || true
          gh release create autocartpvp-1.21.4 autocartpvp/build/libs/autocartpvp-*.jar --title "Auto CartPvP 1.21.4" --notes "Port for Minecraft 1.21.4 Fabric. Fixes the bow never shooting: it now holds the bow long enough to fire and then releases. Needs Fabric API and YACL 3.6+ (ModMenu optional)."
