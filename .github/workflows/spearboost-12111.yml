name: SpearBoost 1.21.11 build
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release'
        default: 'true'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.2.0" }
      - name: Build
        working-directory: spearboost-12111
        run: |
          gradle --no-daemon build
          ls -la build/libs
      - uses: actions/upload-artifact@v4
        with: { name: spearboost-jar, path: spearboost-12111/build/libs/*.jar }
      - name: Release
        if: ${{ github.event.inputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete spearboost-1.21.11 --cleanup-tag --yes || true
          gh release create spearboost-1.21.11 spearboost-12111/build/libs/spearboost-*.jar --title "Spear Boost 1.21.11" --notes "Spear Boost 1.0 for Minecraft 1.21.11 Fabric. Press O: swaps to the spear (Lunge preferred) from hotbar or inventory, jabs to dash, swaps back. Needs Fabric API. Key can be changed in Controls."
