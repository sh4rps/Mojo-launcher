name: Robin Cosmetics 1.21.11 build
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release'
        default: 'true'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.2.0" }
      - name: Build
        working-directory: robincosmetics-12111
        run: |
          gradle --no-daemon build
          ls -la build/libs
      - uses: actions/upload-artifact@v4
        with: { name: robincosmetics-jar, path: robincosmetics-12111/build/libs/*.jar }
      - name: Release
        if: ${{ github.event.inputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete robincosmetics-1.21.11 --cleanup-tag --yes || true
          gh release create robincosmetics-1.21.11 robincosmetics-12111/build/libs/robincosmetics-*.jar --title "Robin Cosmetics 1.21.11" --notes "Robin Cosmetics 1.2 (flat 2D pixel-art animated flame hands, 8 capes) for Minecraft 1.21.11 Fabric: animated capes and animated fire on both hands in any colour. Open from the Robin Cosmetics button in the pause menu or with J. Only you see it. Needs Fabric API."
