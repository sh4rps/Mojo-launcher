name: Build Rust Mod
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build
        working-directory: rustmod
        run: gradle --no-daemon build
      - name: Release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          ls -la rustmod/build/libs
          cp rustmod/build/libs/rustmod-1.0.0.jar rustmod-1.21.4.jar
          gh release delete rustmod -y --cleanup-tag || true
          gh release create rustmod rustmod-1.21.4.jar --title "Rust Mod (Fabric 1.21.4)" --notes "Max-performance Fabric mod for Minecraft 1.21.4. Needs Fabric API."
