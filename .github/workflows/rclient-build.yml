name: RClient build
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release'
        default: 'true'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.2.0' }
      - name: Build
        working-directory: rclient
        run: |
          ./scripts/resolve-versions.sh 1.21.11
          gradle --no-daemon build
          ls -la build/libs
      - uses: actions/upload-artifact@v4
        with:
          name: rclient-jar
          path: rclient/build/libs/*.jar
      - name: Release
        if: ${{ github.event.inputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls rclient/build/libs/rclient-*.jar | grep -v sources | head -1)
          gh release delete rclient-v1.0.0 --cleanup-tag --yes || true
          gh release create rclient-v1.0.0 "$JAR" --title "RClient 1.0.0 (Fabric 1.21.11)" --notes-file rclient/RELEASE.md
