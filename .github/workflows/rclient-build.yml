name: RClient build
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release'
        default: 'true'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.2.0' }
      - name: Build
        working-directory: rclient
        run: |
          ./scripts/resolve-versions.sh 1.21.11
          gradle --no-daemon build
          ls -la build/libs
      - name: Verify jar and mixin targets
        working-directory: rclient
        run: |
          JAR=$(ls build/libs/rclient-*.jar | grep -v sources | head -1)
          echo "== jar: $JAR"; unzip -l "$JAR" | tail -3
          unzip -l "$JAR" | grep -E "mixins|refmap|fabric.mod|lang/en_us" || true
          unzip -p "$JAR" rclient-refmap.json 2>/dev/null | head -40 || true
          MC=$(find ~/.gradle .gradle -name '*.jar' -size +5M 2>/dev/null | while read j; do unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/client/MinecraftClient.class" && echo "$j"; done | head -1)
          echo "MC=$MC"
          echo "== Camera.update calls"; javap -cp "$MC" -private -c net.minecraft.client.render.Camera | awk '/ void update\(/,/return$/' | grep -E "invoke" | head -20
          echo "== GameRenderer.getFov returns"; javap -cp "$MC" -private -c net.minecraft.client.render.GameRenderer | awk '/ float getFov\(/,/freturn/' | grep -E "freturn|invoke" | head -20
          echo "== Entity.changeLookDirection"; javap -cp "$MC" -private net.minecraft.entity.Entity | grep changeLookDirection
      - name: Debug refmap
        working-directory: rclient
        run: |
          echo "== refmap files"; find build -iname '*refmap*' | head
          echo "== classes dir top"; ls build/classes/java/main | head
          echo "== mixins json in jar"; unzip -p build/libs/rclient-1.0.0.jar rclient.mixins.json
          echo "== compile info"; gradle --no-daemon compileJava --rerun-tasks --info 2>&1 | grep -iE "mixin|refmap|processor|AinMap|AoutRef|-A" | head -30
      - uses: actions/upload-artifact@v4
        with:
          name: rclient-jar
          path: rclient/build/libs/*.jar
      - name: Release
        if: ${{ github.event.inputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls rclient/build/libs/rclient-*.jar | grep -v sources | head -1)
          gh release delete rclient-v1.0.0 --cleanup-tag --yes || true
          gh release create rclient-v1.0.0 "$JAR" --title "RClient 1.0.0 (Fabric 1.21.11)" --notes-file rclient/RELEASE.md
