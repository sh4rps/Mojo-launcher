name: Release Send Launcher
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          (cd dist-send && sha256sum -c SHA256SUMS)
          gh release delete send-v1.0 -y --cleanup-tag || true
          gh release create send-v1.0 dist-send/SendLauncher-V1.0.apk dist-send/SHA256SUMS --title "Send Launcher V1.0" --notes "Send Launcher V1.0 (slim, ~40 MB) with the new home screen: 3D skin stage, Skins and Capes, purple theme. Java 8 bundled; Java 17/21 download on first use."
