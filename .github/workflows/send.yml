name: Release Send Launcher
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join and release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          cat parts-send/p.* > SendLauncher-V1.0.apk
          echo "$(cat parts-send/SHA256)  SendLauncher-V1.0.apk" | sha256sum -c
          gh release delete send-v1.0 -y --cleanup-tag || true
          gh release create send-v1.0 SendLauncher-V1.0.apk --title "Send Launcher V1.0" --notes "Send Launcher V1.0 - Java Edition launcher fork: landscape UI, games/SendLauncher folder, Skins and Capes, tuned defaults for low-end phones."
