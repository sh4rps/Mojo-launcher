name: Build Robincord
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        working-directory: robincord
        run: gradle --no-daemon assembleRelease
      - name: Release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          cp robincord/app/build/outputs/apk/release/app-release.apk Robincord.apk
          ls -la Robincord.apk
          gh release delete robincord -y --cleanup-tag || true
          gh release create robincord Robincord.apk --title "Robincord" --notes "Robincord screen recorder: internal + mic audio, pause/resume, up to 1080p / 90 fps / 48 Mbps, saves to internal storage or SD card."
