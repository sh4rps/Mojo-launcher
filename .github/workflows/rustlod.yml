name: Build Rust LOD
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build
        working-directory: rustlod
        run: gradle --no-daemon build
      - name: Release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          ls -la rustlod/build/libs
          cp rustlod/build/libs/rustlod-1.0.0.jar rustlod-1.21.4.jar
          gh release delete rustlod -y --cleanup-tag || true
          gh release create rustlod rustlod-1.21.4.jar --title "Rust LOD (Fabric 1.21.4)" --notes "Far terrain (LOD) Fabric mod for Minecraft 1.21.4. Client-only works on any server; with the mod on the server it also streams unexplored terrain. Needs Fabric API."
