name: Robin HUD 1.21.11 build
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release'
        default: 'true'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.2.0" }
      - name: Build
        working-directory: robinhud-12111
        run: |
          gradle --no-daemon build
          ls -la build/libs
      - uses: actions/upload-artifact@v4
        with: { name: robinhud-jar, path: robinhud-12111/build/libs/*.jar }
      - name: Release
        if: ${{ github.event.inputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete robinhud-1.21.11 --cleanup-tag --yes || true
          gh release create robinhud-1.21.11 robinhud-12111/build/libs/robinhud-*.jar --title "Robin HUD 1.21.11" --notes "Robin HUD 1.0 for Minecraft 1.21.11 Fabric: potion HUD, armor HUD, inventory HUD and Fullbright. H opens the settings (also a button in the pause menu), B toggles Fullbright. Needs Fabric API."
