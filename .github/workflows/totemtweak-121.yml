name: Totem Tweaker 1.21 build
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release'
        default: 'true'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.2.0" }
      - name: Build
        working-directory: totemtweak-121
        run: |
          gradle --no-daemon build
          ls -la build/libs
      - uses: actions/upload-artifact@v4
        with: { name: totemtweak-jar, path: totemtweak-121/build/libs/*.jar }
      - name: Release
        if: ${{ github.event.inputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete totemtweak-1.21 --cleanup-tag --yes || true
          gh release create totemtweak-1.21 totemtweak-121/build/libs/totemtweak-*.jar --title "Totem Tweaker 1.21" --notes "Totem Tweaker 1.0 for Minecraft 1.21 and 1.21.1 Fabric. Press O: move the totem pop animation left/right, up/down, forward/back and change its size, live preview. Needs Fabric API."
