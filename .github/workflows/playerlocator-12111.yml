name: PlayerLocator 1.21.11 build
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release'
        default: 'true'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.2.0" }
      - name: Build
        working-directory: playerlocator-12111
        run: |
          gradle --no-daemon build
          ls -la build/libs
      - uses: actions/upload-artifact@v4
        with: { name: playerlocator-jar, path: playerlocator-12111/build/libs/*.jar }
      - name: Release
        if: ${{ github.event.inputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete playerlocator-1.21.11 --cleanup-tag --yes || true
          gh release create playerlocator-1.21.11 playerlocator-12111/build/libs/playerlocator-*.jar --title "Player Locator HUD 1.21.11" --notes "Player Locator HUD 1.0 for Minecraft 1.21.11 Fabric. Locator strip above the XP bar with the skin heads of other players (direction, name and distance of the one you face, 30,000 block cap). Press K to toggle. Needs Fabric API."
