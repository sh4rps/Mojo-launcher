name: Riscord build
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release'
        default: 'true'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        working-directory: robinriscord
        run: gradle --no-daemon assembleRelease
      - name: App signing SHA-1 (for Firebase Google sign-in)
        run: keytool -list -v -keystore v2/robin.jks -storepass mojogames -alias mojo | grep -E "SHA1|SHA256"
      - name: Collect APK
        run: |
          mkdir -p out
          cp robinriscord/app/build/outputs/apk/release/*.apk out/Riscord.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: robinriscord-apk, path: out/Riscord.apk }
      - name: Release
        if: ${{ github.event.inputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete riscord-v1.0 --cleanup-tag --yes || true
          gh release create riscord-v1.0 out/Riscord.apk --title "Riscord 1.0" --notes "Voice calls with friends: Google login, usernames, friends, group calls."
