name: Build RustBridgeLauncher
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Tools and base APK
        run: |
          pip install pillow numpy
          curl -L -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          curl -L -o signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          curl -L -o base.apk https://github.com/cheesakeyk/OFFLINE-FORK/releases/download/0.10.21/DroidBridge-OFFLINE-FORK_0.10.21.apk
          ls -la base.apk
      - name: Compile storage helper
        run: |
          SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          BT=$(ls -d $SDK/build-tools/* | sort -V | tail -1)
          PL=$(ls -d $SDK/platforms/android-* | sort -V | tail -1)
          mkdir -p rbcls
          javac --release 8 -cp $PL/android.jar -d rbcls rustbridge/java/rb/Store.java
          $BT/d8 --min-api 21 --output . rbcls/rb/*.class
          mv classes.dex classes2.dex
      - name: Patch and build
        run: |
          java -jar apktool.jar d -f -o dec base.apk
          python3 rustbridge/patch.py "$PWD/dec"
          java -jar apktool.jar b -f -o unsigned.apk dec
          zip -q unsigned.apk classes2.dex
          java -jar signer.jar -a unsigned.apk --ks v2/robin.jks --ksAlias mojo --ksPass mojogames --ksKeyPass mojogames -o out
          mv out/unsigned-aligned-signed.apk RustBridgeLauncher.apk
          ls -la RustBridgeLauncher.apk; sha256sum RustBridgeLauncher.apk
      - name: Release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release delete rustbridge -y --cleanup-tag || true
          gh release create rustbridge RustBridgeLauncher.apk --title "RustBridgeLauncher" --notes "Red-themed, renamed fork build. Java 8/17/21/25 + LWJGL 3.3.3 included. Data saved in /sdcard/games/RustBridge (allow All files access)."
