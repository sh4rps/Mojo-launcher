name: Recon javap
on: workflow_dispatch
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.2.0" }
      - name: Build both
        run: |
          (cd totemtweak-12111 && gradle --no-daemon build -q 2>&1 | tail -3) || true
          (cd totemtweak-121 && gradle --no-daemon build -q 2>&1 | tail -3) || true
      - name: javap
        run: |
          for d in totemtweak-12111 totemtweak-121; do
            J=$(find $d -name "minecraft-merged*.jar" 2>/dev/null | grep -v sources | head -1)
            echo "##### $d $J"
            javap -p -cp "$J" net.minecraft.client.render.item.HeldItemRenderer | cut -c1-260 | grep -E "render|Item"
            echo "--- code renderFirstPersonItem"
            javap -p -c -cp "$J" net.minecraft.client.render.item.HeldItemRenderer | awk '/void renderFirstPersonItem\(/{p=1} /void renderArmHoldingItem|void renderMapInBothHands|void renderMapInOneHand|void renderArm\(/{if(p)p=0} p' | grep -E "^  [a-z]|invoke|getfield|ldc|fconst" | grep -vE "MathHelper|RotationAxis" | cut -c1-230 | head -90
          done
