name: Recon javap
on: workflow_dispatch
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.2.0" }
      - name: Build skeleton
        working-directory: spearboost-12111
        run: gradle --no-daemon build -q || true
      - name: javap
        working-directory: spearboost-12111
        run: |
          J=$(find . -name "minecraft-merged*1.21.11*.jar" 2>/dev/null | grep -v sources | head -1)
          for c in net.minecraft.server.world.ServerChunkManager net.minecraft.server.world.ChunkTicketManager net.minecraft.server.world.ChunkTicketType net.minecraft.server.world.ChunkLevels net.minecraft.server.MinecraftServer; do echo "=== $c"; javap -p -cp "$J" "$c" 2>&1 | grep -iE "class |ticket|Ticket|chunkLoad|shouldKeepTicking|runTasks|waitFor|tickChunks|getChunk\(|isChunk|updateChunk|executeQueued|initial" | head -40; done
