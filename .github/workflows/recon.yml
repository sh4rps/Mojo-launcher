name: Recon javap
on: workflow_dispatch
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.2.0" }
      - name: Build skeleton
        working-directory: spearboost-12111
        run: gradle --no-daemon build -q || true
      - name: javap
        working-directory: spearboost-12111
        run: |
          J=$(find . -name "minecraft-merged*1.21.11*.jar" 2>/dev/null | grep -v sources | head -1)
          echo "=== OQ"; javap -p -cp "$J" net.minecraft.client.render.command.OrderedRenderCommandQueue | cut -c1-260
          echo "=== RL"; javap -p -cp "$J" net.minecraft.client.render.RenderLayers | grep -iE "translucent|item|entity" | cut -c1-200
          echo "=== IRS"; javap -p -cp "$J" net.minecraft.client.render.item.ItemRenderState | cut -c1-220
          echo "=== layer enum"; javap -p -cp "$J" 'net.minecraft.client.render.item.ItemRenderState$LayerRenderState' | cut -c1-220
          echo "=== ItemCmd"; javap -p -cp "$J" 'net.minecraft.client.render.command.RenderCommandQueue' 2>&1 | head -5
