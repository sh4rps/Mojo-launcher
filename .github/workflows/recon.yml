name: Recon javap
on: workflow_dispatch
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.2.0" }
      - name: Build skeleton to get mapped jar
        working-directory: spearboost-12111
        run: gradle --no-daemon build -q || true
      - name: javap
        working-directory: spearboost-12111
        run: |
          J=$(find . ~/.gradle -name "minecraft-merged*1.21.11*.jar" 2>/dev/null | grep -v sources | head -1); echo "JAR $J"
          [ -z "$J" ] && find / -name "*.jar" -path "*1.21.11*" 2>/dev/null | head -20
          javap -p -c -cp "$J" net.minecraft.client.gl.GlCommandEncoder | awk '/void presentTexture/{f=1} f&&/^$/{exit} f' | grep -E "invoke|getfield|getstatic|ldc|bipush|sipush|iconst|presentTexture" | cut -c1-230
          echo "=== other presentTexture impls"
          grep -rl presentTexture . 2>/dev/null | head -2; unzip -l "$J" | grep -iE "Encoder" | head
