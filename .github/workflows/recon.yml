name: Recon javap
on: workflow_dispatch
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.2.0" }
      - name: Build skeleton
        working-directory: spearboost-12111
        run: gradle --no-daemon build -q || true
      - name: javap
        working-directory: spearboost-12111
        run: |
          J=$(find . -name "minecraft-merged*1.21.11*.jar" 2>/dev/null | grep -v sources | head -1)
          F=$(find / -name "fabric-rendering-v1*.jar" -not -name "*sources*" 2>/dev/null | head -1); echo "FJ=$F"
          for c in net.fabricmc.fabric.api.client.rendering.v1.world.WorldRenderEvents net.fabricmc.fabric.api.client.rendering.v1.world.WorldRenderContext net.fabricmc.fabric.api.client.rendering.v1.WorldRenderEvents net.fabricmc.fabric.api.client.rendering.v1.WorldRenderContext; do echo "=== $c"; javap -p -cp "$F:$J" "$c" 2>&1 | head -40; done
          for c in net.minecraft.client.render.debug.DebugRenderer net.minecraft.client.render.VertexRendering net.minecraft.client.render.RenderLayer net.minecraft.entity.Entity; do echo "=== $c"; javap -p -cp "$J" "$c" 2>&1 | grep -iE "class |drawBox|drawOutline|LINES|getTeamColor|isGlowing|hasOutline|LayerLines|DEBUG" | head -20; done
