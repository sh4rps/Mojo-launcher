name: Recon yarn
on: workflow_dispatch
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - name: Dump mappings
        run: |
          curl -sSL -o y.jar "https://maven.fabricmc.net/net/fabricmc/yarn/1.21.11+build.6/yarn-1.21.11+build.6-v2.jar"
          unzip -o -q y.jar mappings/mappings.tiny
          awk -F'\t' '
            /^c\t/ { cur=""; n=$NF; if (n ~ /Piercing|Kinetic|SpearItem|net\/minecraft\/client\/MinecraftClient$|ClientPlayerInteractionManager$|Lunge/) { cur=n; print "CLASS " n } ; next }
            /^\t(m|f)\t/ { if (cur!="") print "   " $2 " " $NF "   " $3 }
          ' mappings/mappings.tiny | grep -E "CLASS|ttack|tab|iercing|inetic|unge|pear|Spear|jab|Jab|Cooldown" | head -150
