name: Recon javap
on: workflow_dispatch
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.2.0" }
      - name: Build skeleton
        working-directory: spearboost-12111
        run: gradle --no-daemon build -q || true
      - name: javap
        working-directory: spearboost-12111
        run: |
          J=$(find . -name "minecraft-merged*1.21.11*.jar" 2>/dev/null | grep -v sources | head -1)
          echo "=== TntMinecart"; javap -p -cp "$J" net.minecraft.entity.vehicle.TntMinecartEntity | head -50
          echo "=== interact code"; javap -p -c -cp "$J" net.minecraft.entity.vehicle.TntMinecartEntity | awk '/ActionResult interact\(/{p=1} p' | grep -E "getstatic|invoke|ldc|instanceof" | head -25
          echo "=== damage code"; javap -p -c -cp "$J" net.minecraft.entity.vehicle.TntMinecartEntity | awk '/boolean damage\(/{p=1} /boolean isPrimed/{p=0} p' | grep -E "getstatic|invoke|instanceof" | head -25
          echo "=== igniters tag"; javap -p -c -constants -cp "$J" net.minecraft.registry.tag.ItemTags | grep -i "CREEPER" | head
          echo "=== manager"; javap -p -cp "$J" net.minecraft.client.network.ClientPlayerInteractionManager | grep -E "interactEntity|interactBlock|attackEntity"
