name: Recon javap
on: workflow_dispatch
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.2.0" }
      - name: Build skeleton to get mapped jar
        working-directory: spearboost-12111
        run: gradle --no-daemon build -q || true
      - name: javap
        working-directory: spearboost-12111
        run: |
          J=$(find . ~/.gradle -name "minecraft-merged*1.21.11*.jar" 2>/dev/null | grep -v sources | head -1); echo "JAR $J"
          [ -z "$J" ] && find / -name "*.jar" -path "*1.21.11*" 2>/dev/null | head -20
          javap -p -c -cp "$J" net.minecraft.client.gl.Framebuffer | awk '/public void blitToScreen/{f=1} /public com.mojang.blaze3d.textures.GpuTexture getColorAttachment/{f=0} f' | grep -E "invoke|Field|getstatic|ldc|public|private" | cut -c1-230
          echo "=== BlitRenderer / sampler"
          javap -p -c -cp "$J" net.minecraft.client.gl.RenderPassImpl 2>&1 | head -3
          javap -p -cp "$J" net.minecraft.client.gl.GlCommandEncoder 2>&1 | grep -iE "pass|Viewport|scissor" | head
