name: Recon javap
on: workflow_dispatch
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.2.0" }
      - name: Build skeleton
        working-directory: spearboost-12111
        run: gradle --no-daemon build -q || true
      - name: javap
        working-directory: spearboost-12111
        run: |
          J=$(find . -name "minecraft-merged*1.21.11*.jar" 2>/dev/null | grep -v sources | head -1)
          echo "=== IOR"; javap -p -cp "$J" net.minecraft.client.gui.hud.InGameOverlayRenderer | cut -c1-200
          echo "=== IOR code"; javap -p -c -cp "$J" net.minecraft.client.gui.hud.InGameOverlayRenderer | awk '/renderFloatingItem\(|void method_[0-9]*\(.*DrawContext/{p=1} p' | grep -E "^  [a-z]|invoke|getfield|ldc|fconst|bipush|sipush" | cut -c1-210 | head -120
