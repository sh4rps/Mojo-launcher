name: Recon javap
on: workflow_dispatch
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.2.0" }
      - name: Build skeleton
        working-directory: totemtweak-12111
        run: gradle --no-daemon build -q 2>&1 | tail -3 || true
      - name: javap
        working-directory: totemtweak-12111
        run: |
          J=$(find . -name "minecraft-merged*1.21.11*.jar" 2>/dev/null | grep -v sources | head -1)
          p() { echo "##### $1"; javap -p -cp "$J" "$1" 2>&1 | grep -vE "^Compiled|method_|field_|static \{\}" | cut -c1-250 | head -${2:-70}; }
          echo "##### RCQ"; javap -p -cp "$J" net.minecraft.client.render.command.RenderCommandQueue | grep -iE "ModelPart|submitModel" | cut -c1-400
          echo "##### layers"; javap -p -cp "$J" net.minecraft.client.render.RenderLayers | grep -E "entityCutout|entityTranslucent|entitySolid|eyes|Emissive" | cut -c1-200
          echo "##### skintype"; javap -p -cp "$J" net.minecraft.entity.player.PlayerSkinType | head -8
          echo "##### LightmapTM"; javap -p -constants -cp "$J" net.minecraft.client.render.LightmapTextureManager | grep -i MAX
          echo "##### OverlayTexture"; javap -p -constants -cp "$J" net.minecraft.client.render.OverlayTexture | grep -iE "DEFAULT|static"
