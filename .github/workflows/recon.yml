name: Recon javap
on: workflow_dispatch
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.2.0" }
      - name: Build skeleton
        working-directory: spearboost-12111
        run: gradle --no-daemon build -q || true
      - name: javap
        working-directory: spearboost-12111
        run: |
          J=$(find . -name "minecraft-merged*1.21.11*.jar" 2>/dev/null | grep -v sources | head -1)
          echo "=== lines classes"; unzip -l "$J" | grep -iE "RenderLayers?\.class|RenderPipelines\.class|RenderLayer\\$|VertexRendering" | awk '{print $4}' | head -20
          for c in net.minecraft.client.render.RenderLayer net.minecraft.client.gl.RenderPipelines net.minecraft.client.render.RenderLayers; do echo "=== $c"; javap -p -cp "$J" "$c" 2>&1 | grep -iE "line|debug|class |Pipeline" | head -30; done
          echo "=== ItemFrame/Chest"; javap -p -cp "$J" net.minecraft.entity.decoration.ItemFrameEntity | grep -iE "getHeldItemStack|class "; javap -p -cp "$J" net.minecraft.block.ChestBlock | grep -iE "getFacing|getDoubleBlockType|CHEST_TYPE"; javap -p -cp "$J" net.minecraft.screen.GenericContainerScreenHandler | grep -iE "getInventory|class "; javap -p -cp "$J" net.minecraft.client.util.math.MatrixStack | grep -iE "peek|push|pop|translate"
