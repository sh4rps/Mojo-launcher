name: Recon javap
on: workflow_dispatch
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.2.0" }
      - name: Build skeleton
        working-directory: totemtweak-12111
        run: gradle --no-daemon build -q 2>&1 | tail -3 || true
      - name: javap
        working-directory: totemtweak-12111
        run: |
          J=$(find . -name "minecraft-merged*1.21.11*.jar" 2>/dev/null | grep -v sources | head -1)
          for c in net.minecraft.entity.player.SkinTextures net.minecraft.util.AssetInfo 'net.minecraft.util.AssetInfo$TextureAsset' 'net.minecraft.util.AssetInfo$TextureAssetInfo' net.minecraft.client.network.AbstractClientPlayerEntity net.minecraft.client.texture.NativeImageBackedTexture net.minecraft.client.texture.TextureManager net.minecraft.client.render.entity.feature.CapeFeatureRenderer net.minecraft.client.render.entity.state.PlayerEntityRenderState net.minecraft.particle.DustParticleEffect net.minecraft.client.option.Perspective; do
            echo "##### $c"; javap -p -cp "$J" "$c" 2>&1 | cut -c1-230 | grep -vE "^Compiled" | head -60
          done
          echo "##### ClientWorld particles"; javap -p -cp "$J" net.minecraft.client.world.ClientWorld | grep -i particle | cut -c1-230
          echo "##### NativeImage"; javap -p -cp "$J" net.minecraft.client.texture.NativeImage | grep -iE "setColor|upload|<init>|getWidth|fillRect" | cut -c1-200
          echo "##### cape feature code"; javap -p -c -cp "$J" net.minecraft.client.render.entity.feature.CapeFeatureRenderer | grep -E "invoke|getfield" | cut -c1-230 | head -40
          echo "##### Perspective"; javap -p -cp "$J" net.minecraft.client.option.Perspective | head -12
