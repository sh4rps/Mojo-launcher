name: Robin Mods build
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release'
        default: 'true'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        working-directory: robinmods
        run: gradle --no-daemon assembleRelease
      - name: Collect APK
        run: |
          mkdir -p out
          cp robinmods/app/build/outputs/apk/release/*.apk out/RobinMods.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: robinmods-apk, path: out/RobinMods.apk }
      - name: Release
        if: ${{ github.event.inputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete robinmods-v1.0 --cleanup-tag --yes || true
          gh release create robinmods-v1.0 out/RobinMods.apk --title "Robin Mods 1.0" --notes "Modrinth-style browser: search and install mods, modpacks, shaders and resource packs into your game folder."
