name: Robindium Extra 1.21.11 build
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release'
        default: 'true'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.2.0" }
      - name: Build
        working-directory: robindiumextra-12111
        run: |
          gradle --no-daemon build
          ls -la build/libs
      - uses: actions/upload-artifact@v4
        with: { name: robindiumextra-jar, path: robindiumextra-12111/build/libs/*.jar }
      - name: Release
        if: ${{ github.event.inputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete robindiumextra-1.21.11 --cleanup-tag --yes || true
          gh release create robindiumextra-1.21.11 robindiumextra-12111/build/libs/robindiumextra-*.jar --title "Robindium Extra 1.21.11" --notes "Robindium Extra 1.0 for Minecraft 1.21.11 Fabric. Standalone, does not need Sodium. Right Shift opens settings: render distance limits for players, mobs, decor, block entities, particles, plus clouds and shadows. Config: config/robindiumextra.properties. Needs Fabric API."
