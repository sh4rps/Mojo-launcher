name: Totem Memory 1.21.11 build
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release'
        default: 'true'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.2.0" }
      - name: Build
        working-directory: totemmemory-12111
        run: |
          gradle --no-daemon build
          ls -la build/libs
      - uses: actions/upload-artifact@v4
        with: { name: totemmemory-jar, path: totemmemory-12111/build/libs/*.jar }
      - name: Release
        if: ${{ github.event.inputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete totemmemory-1.21.11 --cleanup-tag --yes || true
          gh release create totemmemory-1.21.11 totemmemory-12111/build/libs/totemmemory-*.jar --title "Totem Memory 1.21.11" --notes "Totem Memory 1.2 (works on servers, shows a "saved" message when it remembers a chest, through walls) for Minecraft 1.21.11 Fabric. Outlines in yellow the chests and barrels you opened that hold Totems of Undying, and item frames holding a totem (within 256 blocks). H toggles. Needs Fabric API."
