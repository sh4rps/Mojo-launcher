name: Build Rust Client
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Rust toolchain
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
      - name: Build Rust launcher (.so)
        working-directory: rustclient
        run: |
          export ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}
          cargo ndk -t arm64-v8a -p 26 -o shell/lib build --release
          ls -la shell/lib/arm64-v8a
      - name: Package and sign
        run: |
          curl -L -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          curl -L -o signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          java -jar apktool.jar b -f -o base.apk rustclient/shell
          java -jar signer.jar -a base.apk --ks v2/robin.jks --ksAlias mojo --ksPass mojogames --ksKeyPass mojogames -o out
          mv out/base-aligned-signed.apk RustClient.apk
          ls -la RustClient.apk; sha256sum RustClient.apk
      - name: Release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release delete rust-client -y --cleanup-tag || true
          gh release create rust-client RustClient.apk --title "Rust Client" --notes "Rust Client: launcher written in Rust, runs Minecraft 26.3 on the Horizon Rust engine inside the app (GPL/MIT credits of Horizon in its notices)."
