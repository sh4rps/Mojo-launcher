[package]
name = "rustclient"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
ndk = "0.9"
ndk-sys = "0.6"
jni = "0.21"
log = "0.4"
android_logger = "0.14"
font8x8 = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
