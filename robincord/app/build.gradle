plugins { id 'com.android.application' }
android {
    namespace 'com.robin.cord'
    compileSdk 34
    defaultConfig {
        applicationId 'com.robin.cord'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }
    signingConfigs {
        rel {
            storeFile file('../../v2/robin.jks')
            storePassword 'mojogames'
            keyAlias 'mojo'
            keyPassword 'mojogames'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.rel
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
