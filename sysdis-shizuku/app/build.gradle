plugins { id 'com.android.application' }
android {
    namespace 'com.sysdis.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.sysdis.app'
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName '2.0'
    }
    signingConfigs {
        rel {
            storeFile file('../../v2/robin.jks')
            storePassword 'mojogames'
            keyAlias 'mojo'
            keyPassword 'mojogames'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.rel
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
