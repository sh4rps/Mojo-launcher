plugins { id 'com.android.application' }
android {
    namespace 'com.robin.setting'
    compileSdk 34
    defaultConfig {
        applicationId 'com.robin.setting'
        minSdk 29
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        rel {
            storeFile file('../../v2/robin.jks')
            storePassword 'mojogames'
            keyAlias 'mojo'
            keyPassword 'mojogames'
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.rel } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
